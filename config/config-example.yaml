# DiegoC Agent Configuration Example
#
# Configuration File Locations (in priority order):
# 1) ./config/config.yaml - Development (current directory)
# 2) ~/.diegoc-agent/config/config.yaml - User config directory
# 3) Executable directory /config/config.yaml
#
# Copy to config.yaml and fill in your API key.

# ===== LLM Configuration =====
api_key: "YOUR_API_KEY_HERE"
# api_base: "https://api.minimax.io"   # Global
api_base: "https://api.minimaxi.com"   # China
model: "MiniMax-M2.5"
provider: "anthropic"  # anthropic or openai

# ===== Retry Configuration =====
retry:
  enabled: true
  max_retries: 3
  initial_delay: 1.0
  max_delay: 60.0
  exponential_base: 2.0

# ===== Agent Configuration =====
max_steps: 100
workspace_dir: "./workspace"
system_prompt_path: "system_prompt.md"
token_limit: 80000  # trigger context summarization when exceeded

# ===== Workspace / Execution Backend =====
# local  - file and shell tools run directly on the host (default)
# docker - tools run inside a container; workspace_dir is bind-mounted at the
#          same absolute path, so edits remain visible on the host
# k8s    - tools run inside a Kubernetes pod (kubectl must be configured)
workspace:
  backend: "local"
  docker:
    container: "diegoc-agent-workspace"
    image: "debian:bookworm-slim"
    remove_on_close: false  # keep the container so files/installs survive restarts
  k8s:
    # kubeconfig: "~/.kube/config"  # empty uses kubectl's default lookup
    # context: "my-context"         # empty uses the current context
    namespace: "default"
    pod: "diegoc-agent-workspace"
    container: "agent"
    image: "debian:bookworm-slim"
    workdir: "/workspace"
    # persistent_volume_claim: ""   # set to mount an existing PVC instead of emptyDir
    image_pull_policy: "IfNotPresent"
    remove_on_close: false          # keep the pod so files survive restarts
    start_timeout_seconds: 120

# ===== Goal Stop Check =====
# Same API key/base/provider as the main model. Select a smaller compatible
# model here if available; empty means the main model in a separate request.
goal:
  model: ""
  max_checks: 10  # maximum stop checks per run; /goal resume starts a new run

# ===== Tools Configuration =====
tools:
  enable_file_tools: true
  enable_bash: true
  enable_note: true
  enable_skills: true
  skills_dir: "./skills"
  enable_mcp: true
  mcp_config_path: "mcp.json"
  mcp:
    connect_timeout: 10.0
    execute_timeout: 60.0
    sse_read_timeout: 120.0

# ===== Long-term Memory =====
memory:
  enabled: false
  working_dir: ".reme"
  # Recall a frozen snapshot on the first user reply. Requires the memory index;
  # unavailable retrieval is skipped. This does not control memory writing.
  injection_enabled: true
